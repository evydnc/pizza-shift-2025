<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пепперони</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <button onclick="location.href='index.html'" class="back-button">← Назад</button>
        <img src="images/pepperoni.jpg" alt="Пепперони" class="pizza-detail-image">
        <h1>Пепперони</h1>
        <p>Пикантная пепперони, увеличенная порция моцареллы, фирменный томатный соус</p>
        
        <div class="size-selection">
            <button class="size-button">Маленькая</button>
            <button class="size-button">Средняя</button>
            <button class="size-button">Большая</button>
        </div>

        <div class="extra-ingredients">
            <h2>Добавить по вкусу</h2>
            <div class="ingredient-list">
                <button class="ingredient-button">
                    <img src="images/extra_cheese.jpg" alt="Сырный бортик" class="ingredient-icon">
                    Сырный бортик 179 ₽
                </button>
                <button class="ingredient-button">
                    <img src="images/extra_shrimp.jpg" alt="Креветки" class="ingredient-icon">
                    Креветки 199 ₽
                </button>
                <button class="ingredient-button">
                    <img src="images/extra_mozzarella.jpg" alt="Сливочная моцарелла" class="ingredient-icon">
                    Сливочная моцарелла 79 ₽
                </button>
                <button class="ingredient-button">
                    <img src="images/extra_cheddar.jpg" alt="Сыры чеддер и пармезан" class="ingredient-icon">
                    Сыры чеддер и пармезан 79 ₽
                </button>
                <button class="ingredient-button">
                    <img src="images/extra_jalapeno.jpg" alt="Острый перец халапеньо" class="ingredient-icon">
                    Острый перец халапеньо 59 ₽
                </button>
                <button class="ingredient-button">
                    <img src="images/extra_chicken.jpg" alt="Нежный цыпленок" class="ingredient-icon">
                    Нежный цыпленок 79 ₽
                </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
